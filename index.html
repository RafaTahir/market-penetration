<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Explore Southeast Asian markets, compare countries and industries, and build a market-entry research brief with Flow." />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flow" />
    <link rel="manifest" href="/manifest.json" />
    <title>Flow — Southeast Asia Market Entry</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      if ('serviceWorker' in navigator) {
        if (import.meta.env.DEV) {
          const isFlowWorker = (worker) => worker && new URL(worker.scriptURL).origin === location.origin && new URL(worker.scriptURL).pathname === '/sw.js';
          const wasControlled = isFlowWorker(navigator.serviceWorker.controller);
          navigator.serviceWorker.getRegistrations().then(async (registrations) => {
            await Promise.all(registrations
              .filter(registration => isFlowWorker(registration.active || registration.waiting || registration.installing))
              .map(registration => registration.unregister()));
            if ('caches' in window) {
              const names = await caches.keys();
              await Promise.all(names.filter(name => name.startsWith('flow-')).map(name => caches.delete(name)));
            }
            if (wasControlled) location.reload();
          }).catch(error => console.warn('Development service worker cleanup failed:', error));
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
              .catch(error => console.warn('Service worker registration failed:', error));
          });
        }
      }
    </script>
  </body>
</html>
